services:
  grok2api:
    image: ghcr.io/chenyme/grok2api:latest
    ports:
      - "8010:8010"
    volumes:
      - grok_data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    networks:
      - 1panel-network
    restart: unless-stopped

volumes:
  grok_data:

networks:
  1panel-network:
    external: true
